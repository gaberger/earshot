# Compiles Earshot for macOS and runs the editor tests on every push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # Apple Silicon. The app targets macOS 26.4 and uses FoundationModels, so it needs that SDK or newer.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Build and package Earshot.app
        run: bash EarshotApp/build.sh

      - name: Run tests
        run: bash EarshotApp/Tests/run.sh

      - name: Zip the app
        run: ditto -c -k --keepParent "$HOME/Applications/Earshot.app" Earshot.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Earshot
          path: Earshot.zip
