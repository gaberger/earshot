# Compiles Earshot for macOS and runs the editor tests on every push and pull request.
# Pushing a tag like v1.2.0 (matching VERSION) also publishes a GitHub Release with the disk image,
# using the hand-written notes in docs/releases/<version>.md (the build fails if that file is missing).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # Apple Silicon. The app targets macOS 26.4 and uses FoundationModels, so it needs that SDK or newer.
    permissions:
      contents: read
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number is the commit count, so it needs the whole history

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match VERSION ($version)"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && ! -f "docs/releases/$version.md" ]]; then
            echo "::error::Missing release notes: docs/releases/$version.md"
            exit 1
          fi

      - name: Build and package Earshot.app
        run: bash EarshotApp/build.sh

      - name: Run tests
        run: bash EarshotApp/Tests/run.sh

      - name: Make the disk image
        run: bash EarshotApp/make-dmg.sh "$HOME/Applications/Earshot.app"

      - uses: actions/upload-artifact@v7
        with:
          name: Earshot-${{ steps.version.outputs.version }}
          path: Earshot-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/releases

      - uses: actions/download-artifact@v8
        with:
          name: Earshot-${{ needs.macos.outputs.version }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Earshot-*.dmg --repo "$GITHUB_REPOSITORY" \
            --title "Earshot ${{ needs.macos.outputs.version }}" \
            --notes-file "docs/releases/${{ needs.macos.outputs.version }}.md"
